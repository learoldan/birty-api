service: birty-api

frameworkVersion: '3'

provider:
    name: aws
    runtime: nodejs22.x
    region: 'eu-west-3'
    stage: ${opt:stage, 'dev'}
    memorySize: 128
    timeout: 29
    environment:
        AWS_NODEJS_CONNECTION_REUSE_ENABLED: '1'
        NODE_ENV: ${self:provider.stage}

        USER_POOL_ID:
            Ref: CognitoUserPool

        CLIENT_ID:
            Ref: CognitoUserPoolClient

        COGNITO_USER_POOL_ID:
            Ref: CognitoUserPool

        COGNITO_CLIENT_ID:
            Ref: CognitoUserPoolClient

        USERS_TABLE: ${self:service}-users-${self:provider.stage}
        BIRTHDAYS_TABLE: ${self:service}-birthdays-${self:provider.stage}
        REMINDERS_TABLE: ${self:service}-reminders-${self:provider.stage}

        RESEND_API_KEY: ${env:RESEND_API_KEY, ''}
        RESEND_FROM_EMAIL:
            ${env:RESEND_FROM_EMAIL, 'Birty <onboarding@resend.dev>'}
    iam:
        role:
            statements:
                - Effect: Allow
                  Action:
                      - dynamodb:PutItem
                      - dynamodb:GetItem
                      - dynamodb:UpdateItem
                      - dynamodb:DeleteItem
                      - dynamodb:Query
                  Resource:
                      - Fn::GetAtt:
                            - UsersTable
                            - Arn
                      - Fn::Join:
                            - '/'
                            - - Fn::GetAtt:
                                    - UsersTable
                                    - Arn
                              - 'index/*'
                      - Fn::GetAtt:
                            - BirthdaysTable
                            - Arn
                      - Fn::Join:
                            - '/'
                            - - Fn::GetAtt:
                                    - BirthdaysTable
                                    - Arn
                              - 'index/*'
                      - Fn::GetAtt:
                            - RemindersTable
                            - Arn
                      - Fn::Join:
                            - '/'
                            - - Fn::GetAtt:
                                    - RemindersTable
                                    - Arn
                              - 'index/*'
    httpApi:
        authorizers:
            cognitoAuthorizer:
                type: jwt
                identitySource: $request.header.Authorization
                issuerUrl:
                    Fn::Sub: https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPool}
                audience:
                    - Ref: CognitoUserPoolClient

plugins:
    - serverless-offline
    - serverless-esbuild

custom:
    esbuild:
        bundle: true
        minify: false
        sourcemap: true
        concurrency: 3
        external:
            - aws-sdk

functions:
    createUser: ${file(src/user/adapters/createUser/createUser.yml)}
    deleteUser: ${file(src/user/adapters/deleteUser/deleteUser.yml)}
    getUser: ${file(src/user/adapters/getUser/getUser.yml)}
    updateUser: ${file(src/user/adapters/updateUser/updateUser.yml)}
    register: ${file(src/auth/adapters/register/register.yml)}
    login: ${file(src/auth/adapters/login/login.yml)}
    validate: ${file(src/auth/adapters/validate/validate.yml)}
    changePassword: ${file(src/auth/adapters/changePassword/changePassword.yml)}
    forgotPassword: ${file(src/auth/adapters/forgotPassword/forgotPassword.yml)}
    confirmForgotPassword: ${file(src/auth/adapters/confirmForgotPassword/confirmForgotPassword.yml)}
    createBirthday: ${file(src/birthday/adapters/createBirthday/createBirthday.yml)}
    listBirthdays: ${file(src/birthday/adapters/listBirthdays/listBirthdays.yml)}
    getBirthday: ${file(src/birthday/adapters/getBirthday/getBirthday.yml)}
    updateBirthday: ${file(src/birthday/adapters/updateBirthday/updateBirthday.yml)}
    deleteBirthday: ${file(src/birthday/adapters/deleteBirthday/deleteBirthday.yml)}
    addAlert: ${file(src/birthday/adapters/addAlert/addAlert.yml)}
    removeAlert: ${file(src/birthday/adapters/removeAlert/removeAlert.yml)}
    getAlerts: ${file(src/birthday/adapters/getAlerts/getAlerts.yml)}
    sendBirthdayEmails: ${file(src/birthday/adapters/sendBirthdayEmails/sendBirthdayEmails.yml)}
    sendReminderEmails: ${file(src/birthday/adapters/sendReminderEmails/sendReminderEmails.yml)}

resources:
    Resources:
        # DynamoDB Users Table
        UsersTable:
            Type: AWS::DynamoDB::Table
            Properties:
                TableName: ${self:service}-users-${self:provider.stage}
                BillingMode: PAY_PER_REQUEST
                AttributeDefinitions:
                    - AttributeName: id
                      AttributeType: S
                KeySchema:
                    - AttributeName: id
                      KeyType: HASH
                StreamSpecification:
                    StreamViewType: NEW_AND_OLD_IMAGES
                Tags:
                    - Key: Environment
                      Value: ${self:provider.stage}
            # DynamoDB Birthdays Table
        BirthdaysTable:
            Type: AWS::DynamoDB::Table
            Properties:
                TableName: ${self:service}-birthdays-${self:provider.stage}
                BillingMode: PAY_PER_REQUEST
                AttributeDefinitions:
                    - AttributeName: id
                      AttributeType: S
                    - AttributeName: userId
                      AttributeType: S
                    - AttributeName: birthDate
                      AttributeType: S
                KeySchema:
                    - AttributeName: id
                      KeyType: HASH
                GlobalSecondaryIndexes:
                    - IndexName: UserIdIndex
                      KeySchema:
                          - AttributeName: userId
                            KeyType: HASH
                      Projection:
                          ProjectionType: ALL
                    - IndexName: BirthDateIndex
                      KeySchema:
                          - AttributeName: birthDate
                            KeyType: HASH
                      Projection:
                          ProjectionType: ALL
                StreamSpecification:
                    StreamViewType: NEW_AND_OLD_IMAGES
                Tags:
                    - Key: Environment
                      Value: ${self:provider.stage}

        # DynamoDB Reminders Table
        RemindersTable:
            Type: AWS::DynamoDB::Table
            Properties:
                TableName: ${self:service}-reminders-${self:provider.stage}
                BillingMode: PAY_PER_REQUEST
                AttributeDefinitions:
                    - AttributeName: alertDate
                      AttributeType: S
                    - AttributeName: birthdayId
                      AttributeType: S
                KeySchema:
                    - AttributeName: alertDate
                      KeyType: HASH
                    - AttributeName: birthdayId
                      KeyType: RANGE
                GlobalSecondaryIndexes:
                    - IndexName: BirthdayIdIndex
                      KeySchema:
                          - AttributeName: birthdayId
                            KeyType: HASH
                      Projection:
                          ProjectionType: ALL
                Tags:
                    - Key: Environment
                      Value: ${self:provider.stage}

        # Cognito User Pool
        CognitoUserPool:
            Type: AWS::Cognito::UserPool
            Properties:
                UserPoolName: ${self:provider.stage}-birty-user-pool
                UsernameAttributes:
                    - email
                AutoVerifiedAttributes:
                    - email
                EmailConfiguration:
                    EmailSendingAccount: COGNITO_DEFAULT
                Policies:
                    PasswordPolicy:
                        MinimumLength: 8
                        RequireUppercase: true
                        RequireLowercase: true
                        RequireNumbers: true
                        RequireSymbols: true
                Schema:
                    - Name: email
                      AttributeDataType: String
                      Mutable: false
                      Required: true
                    - Name: given_name
                      AttributeDataType: String
                      Mutable: true
                      Required: false
                    - Name: family_name
                      AttributeDataType: String
                      Mutable: true
                      Required: false
                UserPoolTags:
                    Environment: ${self:provider.stage}

        # Cognito User Pool Client
        CognitoUserPoolClient:
            Type: AWS::Cognito::UserPoolClient
            Properties:
                ClientName: ${self:provider.stage}-birty-client
                UserPoolId:
                    Ref: CognitoUserPool
                ExplicitAuthFlows:
                    - ALLOW_USER_PASSWORD_AUTH
                    - ALLOW_REFRESH_TOKEN_AUTH
                    - ALLOW_USER_SRP_AUTH
                GenerateSecret: false
                PreventUserExistenceErrors: ENABLED

    Outputs:
        UsersTableName:
            Description: DynamoDB Users Table Name
            Value:
                Ref: UsersTable
            Export:
                Name: ${self:provider.stage}-UsersTableName

        UsersTableArn:
            Description: DynamoDB Users Table ARN
            Value:
                Fn::GetAtt:
                    - UsersTable
                    - Arn
            Export:
                Name: ${self:provider.stage}-UsersTableArn

        BirthdaysTableName:
            Description: DynamoDB Birthdays Table Name
            Value:
                Ref: BirthdaysTable
            Export:
                Name: ${self:provider.stage}-BirthdaysTableName

        BirthdaysTableArn:
            Description: DynamoDB Birthdays Table ARN
            Value:
                Fn::GetAtt:
                    - BirthdaysTable
                    - Arn
            Export:
                Name: ${self:provider.stage}-BirthdaysTableArn

        CognitoUserPoolId:
            Description: Cognito User Pool ID
            Value:
                Ref: CognitoUserPool
            Export:
                Name: ${self:provider.stage}-CognitoUserPoolId

        CognitoUserPoolArn:
            Description: Cognito User Pool ARN
            Value:
                Fn::GetAtt:
                    - CognitoUserPool
                    - Arn
            Export:
                Name: ${self:provider.stage}-CognitoUserPoolArn

        CognitoUserPoolClientId:
            Description: Cognito User Pool Client ID
            Value:
                Ref: CognitoUserPoolClient
            Export:
                Name: ${self:provider.stage}-CognitoUserPoolClientId
